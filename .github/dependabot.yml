version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Patch and minor bumps are grouped into one PR; majors come separately so
    # each gets its own CI run and review.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Pinned deliberately: typescript-eslint does not support the TS 7 API,
      # and @types/react must track the installed React major.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      # React 19 needs React Router 7; Remix 2 targets React 18. A react-dom
      # major bump arrived without react itself, which cannot work.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # three is 0.x: its "minor" releases routinely break the API, so they
      # are not the safe grouped bump the minor-and-patch group assumes.
      - dependency-name: three
        update-types: [version-update:semver-minor]
      - dependency-name: '@types/three'
        update-types: [version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
