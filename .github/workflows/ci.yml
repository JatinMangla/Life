name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Vercel reports each deployment back to GitHub. Tests that need the real
  # production build run from this event, against the URL it carries.
  deployment_status:

# Read-only unless a job asks for more.
permissions:
  contents: read

# A new push to the same branch cancels the previous run.
#
# Deployment events carry an empty github.ref, so keyed on the ref alone every
# deployment shared one group: a Dependabot preview deploy cancelled the
# production run just before Lighthouse. Each deployment gets its own group,
# and deployment runs are never cancelled — each one checks a different build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.deployment.id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'deployment_status' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Matches engines.node in package.json and the Vercel function runtime.
      # Node 20 is disabled on Vercel from 1 October 2026.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs postinstall, which copies the Draco decoder into
      # public/draco. If that breaks, every 3D model on the site breaks.
      - name: Install dependencies
        run: npm ci

      # Production dependencies only: dev tooling never ships. The threshold is
      # `critical` until the React Router 7 migration, because the remaining
      # high advisories are all on the Remix 2 / React Router 6 line and have
      # no fix there. Raise it to `high` once that lands.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Draco decoder was emitted
        run: test -f public/draco/draco_decoder.wasm

      # Storybook has its own vite config and its own asset imports, so it can
      # break independently of the app build — and did, silently, for a while.
      - name: Build Storybook
        run: npm run build:storybook

  e2e:
    name: Browser tests (dev server)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # axe over every page in both themes and at mobile width, plus the
      # smoke tests: skip link, theme toggle, contact flow, sitemap.
      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deployed:
    name: Browser tests and Lighthouse (deployed build)
    # Only once Vercel says the deployment is live — auditing on push raced
    # the deploy and measured the previous version.
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    # A blocked or unreachable target used to leave every test waiting out its
    # full timeout, with a retry each: hours of "in progress" instead of a red X.
    timeout-minutes: 30
    env:
      # Preview deployments sit behind Vercel Authentication. The tests send
      # this "Protection Bypass for Automation" secret as a header.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Pages Lighthouse audits. The summary script reads the same list, so a
      # page that produced no report is named rather than silently missing.
      LIGHTHOUSE_PATHS: / /projects/personal-vault /projects/mera-monitor /contact
      LIGHTHOUSE_ERRORS: ${{ github.workspace }}/lighthouse-errors.tsv

    steps:
      - uses: actions/checkout@v4

      # Production is tested at the public address visitors use (url in
      # app/config.json). The URL in the deployment event is the unique
      # per-deployment address, which Vercel protects even for production —
      # and Lighthouse can't send the bypass header, so it would score a
      # login page.
      - name: Resolve the URL to test
        run: |
          if [ "${{ github.event.deployment_status.environment }}" = "Production" ]; then
            target=$(node -p "require('./app/config.json').url")
          else
            target="${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}"
          fi
          echo "BASE_URL=${target%/}" >> "$GITHUB_ENV"
          echo "Testing ${target%/}"

      # Seconds, not hours: check the page is actually reachable first, and
      # say why when it isn't.
      - name: Check the deployment is reachable
        id: reach
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "$BASE_URL/")
          echo "HTTP $status from $BASE_URL/"
          if [ "$status" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" = "401" ] || [ "$status" = "302" ] || [ "$status" = "403" ]; then
            if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
              echo "::warning title=Preview is protected::Skipping browser tests: add the Vercel 'Protection Bypass for Automation' secret as the repository secret VERCEL_AUTOMATION_BYPASS_SECRET (GitHub → Settings → Secrets and variables → Actions)."
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error title=Bypass secret rejected::Vercel answered $status even with VERCEL_AUTOMATION_BYPASS_SECRET set. Copy the secret again from Vercel → Settings → Deployment Protection → Protection Bypass for Automation, and check it is saved in GitHub with no spaces or line breaks."
            exit 1
          fi
          echo "::error title=Deployment unreachable::$BASE_URL answered HTTP $status."
          exit 1

      - uses: actions/setup-node@v4
        if: steps.reach.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.reach.outputs.ok == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.reach.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests against ${{ env.BASE_URL }}
        if: steps.reach.outputs.ok == 'true'
        run: npm run test:e2e -- --max-failures=5

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.reach.outputs.ok == 'true' }}
        with:
          name: playwright-report-deployed
          path: playwright-report
          retention-days: 7

      # Run Lighthouse CI directly with the Chromium Playwright just installed
      # and used. treosh/lighthouse-ci-action launched the runner's own Chrome,
      # and every run from August on died at "collect" with no usable error.
      # Runs on previews too — the bypass header gets it past Vercel's
      # protection — so a pull request shows the scores before it is merged.
      - name: Lighthouse
        if: steps.reach.outputs.ok == 'true'
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          # The bypass header alone. Lighthouse sends extra headers on every
          # request, and adding x-vercel-set-bypass-cookie made Vercel answer
          # each one with a cookie-setting redirect: ERR_TOO_MANY_REDIRECTS in
          # the console cost Best Practices 7 points.
          headers=$(node -p "JSON.stringify(process.env.VERCEL_AUTOMATION_BYPASS_SECRET
            ? { 'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET }
            : {})")
          # Two SEO audits can't pass on a protected preview, so they are
          # skipped there and still enforced on production:
          # - is-crawlable: Vercel sends X-Robots-Tag: noindex on every
          #   preview, which alone takes SEO from 1.0 to about 0.6.
          # - robots-txt: Lighthouse fetches robots.txt without the extra
          #   headers, so on a preview it gets Vercel's login page instead.
          skip=()
          if [ "${{ github.event.deployment_status.environment }}" != "Production" ]; then
            skip=(--settings.skipAudits=is-crawlable,robots-txt)
          fi
          # One page per collect. Given every URL at once, lhci stops at the
          # first page it can't audit and the step fails as a bare "exit code
          # 1" — that is how /contact went unexplained. Per page, the others
          # still get scored, and the failing one is named with Lighthouse's
          # own error, here and again by the summary step.
          # A step's default shell has no pipefail, which would hand the `if`
          # below tee's exit status instead of lhci's.
          set -o pipefail
          : > "$LIGHTHOUSE_ERRORS"
          additive=()
          for path in $LIGHTHOUSE_PATHS; do
            log="$RUNNER_TEMP/lighthouse${path//\//-}.log"
            if ! npx --yes @lhci/cli@0.14.0 collect --config=.lighthouserc.json \
              --url="$BASE_URL$path" \
              --settings.extraHeaders="$headers" \
              "${skip[@]}" "${additive[@]}" 2>&1 | tee "$log"; then
              # Lighthouse's "Runtime error encountered" line names the cause
              # (NO_FCP, PROTOCOL_TIMEOUT...); otherwise the first error line.
              reason=$(grep -m1 -E 'Runtime error encountered|PROTOCOL_TIMEOUT|timed out' "$log" \
                || grep -m1 -iE 'error' "$log" || echo 'lhci collect failed; see the log above')
              printf '%s\t%s\n' "$path" "$reason" >> "$LIGHTHOUSE_ERRORS"
              echo "::error title=Lighthouse could not audit $path::$reason"
            fi
            # Keep the reports already collected; only the first run clears
            # results left over from earlier.
            additive=(--additive)
          done
          # Assert whatever was collected, then fail if any page wasn't.
          npx --yes @lhci/cli@0.14.0 assert --config=.lighthouserc.json
          test ! -s "$LIGHTHOUSE_ERRORS"

      # Shareable report links, then scores and any failing audits as
      # annotations and a job-summary table — pass or fail.
      - name: Upload Lighthouse report
        if: ${{ !cancelled() && steps.reach.outputs.ok == 'true' }}
        run: |
          npx --yes @lhci/cli@0.14.0 upload --target=temporary-public-storage || true
          node scripts/lighthouse-summary.cjs
