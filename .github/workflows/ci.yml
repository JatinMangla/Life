name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Matches engines.node in package.json and the Vercel function runtime.
      # Node 20 is disabled on Vercel from 1 October 2026.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs postinstall, which copies the Draco decoder into
      # public/draco. If that breaks, every 3D model on the site breaks.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Draco decoder was emitted
        run: test -f public/draco/draco_decoder.wasm

      # Storybook has its own vite config and its own asset imports, so it can
      # break independently of the app build — and did, silently, for a while.
      - name: Build Storybook
        run: npm run build:storybook

  e2e:
    name: Accessibility and browser tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs axe over every page at desktop and mobile widths, and asserts the
      # keyboard skip link, the theme toggle and the social links all work.
      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    # Only meaningful against a real deployment, so this runs on main after the
    # Vercel production deploy rather than on pull requests.
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Audit the live site
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://life-puce-kappa.vercel.app/
            https://life-puce-kappa.vercel.app/projects/mera-monitor
            https://life-puce-kappa.vercel.app/contact
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
