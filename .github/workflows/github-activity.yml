name: Refresh GitHub activity

# Keeps the "Latest commits" list on the home page current without the site
# ever calling the GitHub API at runtime or during a Vercel build.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # No npm install: the script uses only Node built-ins and fetch.
      - name: Snapshot recent commits
        run: node scripts/github-activity.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Commits only when something changed; the push deploys the refresh.
      - name: Commit if changed
        run: |
          if git diff --quiet -- app/data/github-activity.json; then
            echo "No new activity."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/github-activity.json
          git commit -m "chore: refresh GitHub activity snapshot"
          git push
